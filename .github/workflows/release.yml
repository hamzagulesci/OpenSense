name: Release

# Push a tag such as v0.2.0 to build the executables and the installer and
# publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version" }
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          New-Item -ItemType Directory zip | Out-Null
          Copy-Item target/release/opensense.exe, target/release/opensense-cli.exe, LICENSE, README.md zip/
          Compress-Archive -Path zip/* -DestinationPath "dist/OpenSense-${{ github.ref_name }}-windows-x64.zip"
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $ico = Get-ChildItem target/release/build -Recurse -Filter opensense.ico | Select-Object -First 1
          if ($ico) { Copy-Item $ico.FullName installer/opensense.ico }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/opensense.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File)
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenSense-${{ github.ref_name }}-setup.exe
            dist/OpenSense-${{ github.ref_name }}-windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
